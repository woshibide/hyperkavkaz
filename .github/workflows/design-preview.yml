name: Design preview

on:
  push:
    branches: [design]
  workflow_dispatch:

concurrency:
  group: design-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/design'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, intl, mbstring
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - run: python3 scripts/export-preview.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _preview

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
