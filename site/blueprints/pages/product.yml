title: Product
icon: cart

columns:
  main:
    width: 2/3
    sections:
      fields:
        type: fields
        fields:
          text:
            type: tiptap
            uploads: image
            size: large
  sidebar:
    width: 1/3
    sections:
      meta:
        type: fields
        fields:
          price:
            type: number
            min: 0
            step: 0.01
            after: EUR
          artist:
            type: pages
            multiple: false
            query: site.find('artists').children
          cover:
            type: files
            multiple: false
            uploads: image
            query: page.images
      files:
        type: files
        template: image
