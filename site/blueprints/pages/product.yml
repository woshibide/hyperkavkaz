title: Product
icon: cart

columns:
  main:
    width: 2/3
    sections:
      fields:
        type: fields
        fields:
          text:
            label: Description
            type: tiptap
            uploads: image
            size: large
          tracklist:
            type: structure
            help: Leave empty for products that are not records.
            fields:
              title:
                type: text
                required: true
                width: 3/4
              length:
                type: text
                width: 1/4
                placeholder: "4:32"
  sidebar:
    width: 1/3
    sections:
      meta:
        type: fields
        fields:
          price:
            type: number
            min: 0
            step: 0.01
            after: EUR
          availability:
            label: Availability
            type: select
            required: true
            default: available
            options:
              available: In stock
              preorder: Pre-order
              soldout: Sold out
          link:
            label: Shop link
            type: url
            help: Where the product is sold, such as its Bandcamp page. The "Buy" button opens it.
          artist:
            type: pages
            multiple: false
            query: site.find('artists').children
          format:
            type: text
            placeholder: 12-inch vinyl
          catalogue:
            label: Catalogue number
            type: text
            placeholder: HK-001
          release:
            label: Release date
            type: date
          cover:
            type: files
            multiple: false
            uploads: image
            query: page.images
      files:
        type: files
        template: image
