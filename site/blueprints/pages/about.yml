title: About
icon: info

columns:
  main:
    width: 2/3
    sections:
      fields:
        type: fields
        fields:
          lead:
            type: textarea
            buttons: false
            size: small
            help: One or two sentences, shown large under the title.
          text:
            type: tiptap
            uploads: image
            size: large
          facts:
            label: Overview
            type: structure
            help: The label at a glance (name, founded, based in, contact), shown as a table.
            fields:
              label:
                type: text
                required: true
                width: 1/3
              value:
                type: text
                required: true
                width: 2/3
          history:
            type: structure
            sortBy: date asc
            help: Milestones, shown oldest first.
            fields:
              date:
                type: date
                required: true
                display: YYYY.MM
                width: 1/3
              event:
                type: text
                required: true
                width: 2/3
  sidebar:
    width: 1/3
    sections:
      files:
        type: files
        template: image
